    <p class="section-kicker">1.1 · Core Architecture</p>
    <p class="detail-hint">Click any box to open its detail panel at the bottom of the screen.</p>
    <div class="canvas">
      <svg viewBox="0 0 1340 800" aria-label="NanoClaw core architecture">
          <defs>
            <marker id="arrowBlue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#58a6ff"/></marker>
            <marker id="arrowGreen" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#3fb950"/></marker>
            <marker id="arrowOrange" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#d29922"/></marker>
            <marker id="arrowPurple" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#bc8cff"/></marker>
          </defs>
          <text x="30" y="35" class="section-label" fill="#d29922">Chat platform</text>
          <text x="380" y="35" class="section-label" fill="#58a6ff">Host orchestrator</text>
          <text x="900" y="35" class="section-label" fill="#3fb950">Disposable group container</text>

          <!-- Row A: chat + router -->
          <g class="node" data-key="feishu">
            <rect x="40" y="80" width="260" height="120" rx="12" fill="#161b22" stroke="#d29922" stroke-width="2"/>
            <text x="170" y="120" text-anchor="middle" class="node-title">Feishu / Lark</text>
            <text x="170" y="146" text-anchor="middle" class="node-sub">message polling + replies</text>
            <text x="170" y="168" text-anchor="middle" class="node-sub">one chat ID → one group</text>
          </g>
          <g class="node" data-key="router">
            <rect x="380" y="80" width="200" height="120" rx="12" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
            <text x="480" y="120" text-anchor="middle" class="node-title">Channel Router</text>
            <text x="480" y="146" text-anchor="middle" class="node-sub">poll every 2 seconds</text>
            <text x="480" y="168" text-anchor="middle" class="node-sub">chat ID → group folder</text>
          </g>

          <!-- Row B: queue + session manager (side by side, same row) -->
          <g class="node" data-key="queue">
            <rect x="380" y="240" width="200" height="120" rx="12" fill="#161b22" stroke="#79c0ff" stroke-width="2"/>
            <text x="480" y="278" text-anchor="middle" class="node-title">Per-group Queue</text>
            <text x="480" y="304" text-anchor="middle" class="node-sub">independent ordering</text>
            <text x="480" y="326" text-anchor="middle" class="node-sub">max 5 active containers</text>
          </g>
          <g class="node" data-key="sessionManager">
            <rect x="620" y="240" width="200" height="120" rx="12" fill="#161b22" stroke="#bc8cff" stroke-width="2"/>
            <text x="720" y="278" text-anchor="middle" class="node-title">Session Manager</text>
            <text x="720" y="304" text-anchor="middle" class="node-sub">group → Claude UUID</text>
            <text x="720" y="326" text-anchor="middle" class="node-sub">persisted in SQLite</text>
          </g>

          <!-- Row C: container runner -->
          <g class="node" data-key="runner">
            <rect x="380" y="400" width="200" height="160" rx="12" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
            <text x="480" y="438" text-anchor="middle" class="node-title">Container Runner</text>
            <text x="480" y="464" text-anchor="middle" class="node-sub">build mounts + docker args</text>
            <text x="480" y="486" text-anchor="middle" class="node-sub">stdin: prompt + sessionId</text>
            <text x="480" y="508" text-anchor="middle" class="node-sub">30-minute idle timeout</text>
          </g>

          <!-- Group container (right column, spans rows A-C) -->
          <g class="node" data-key="container">
            <rect x="900" y="80" width="400" height="480" rx="15" fill="#0f1318" stroke="#3fb950" stroke-width="2" stroke-dasharray="8 5"/>
            <text x="920" y="106" class="node-title">nanoclaw-&lt;group&gt;-&lt;timestamp&gt;</text>
            <rect x="930" y="125" width="340" height="100" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
            <text x="1100" y="158" text-anchor="middle" class="node-title">agent-runner</text>
            <text x="1100" y="182" text-anchor="middle" class="node-sub">Claude SDK query(resume: sessionId)</text>
            <text x="1100" y="204" text-anchor="middle" class="node-sub">Bash / Read / Write / Web / Tasks</text>
            <rect x="930" y="250" width="105" height="280" rx="9" fill="#1a1500" stroke="#d29922"/>
            <text x="982" y="288" text-anchor="middle" class="node-title" font-size="11">/workspace</text>
            <text x="982" y="308" text-anchor="middle" class="node-title" font-size="11">/group</text>
            <text x="982" y="344" text-anchor="middle" class="node-sub">project</text>
            <text x="982" y="364" text-anchor="middle" class="node-sub">files</text>
            <rect x="1045" y="250" width="105" height="280" rx="9" fill="#1a0030" stroke="#bc8cff"/>
            <text x="1097" y="288" text-anchor="middle" class="node-title" font-size="11">/home/node</text>
            <text x="1097" y="308" text-anchor="middle" class="node-title" font-size="11">/.claude</text>
            <text x="1097" y="344" text-anchor="middle" class="node-sub">JSONL</text>
            <text x="1097" y="364" text-anchor="middle" class="node-sub">skills</text>
            <rect x="1160" y="250" width="105" height="280" rx="9" fill="#001a2a" stroke="#79c0ff"/>
            <text x="1212" y="288" text-anchor="middle" class="node-title" font-size="11">/workspace</text>
            <text x="1212" y="308" text-anchor="middle" class="node-title" font-size="11">/ipc</text>
            <text x="1212" y="344" text-anchor="middle" class="node-sub">input</text>
            <text x="1212" y="364" text-anchor="middle" class="node-sub">messages</text>
          </g>

          <!-- Persistent host state, full width footer row -->
          <g class="node" data-key="hostState">
            <rect x="40" y="620" width="1260" height="120" rx="12" fill="#161b22" stroke="#d29922" stroke-width="2"/>
            <text x="65" y="650" class="node-title">Persistent host state</text>
            <text x="65" y="682" class="node-sub">groups/&lt;group&gt;/</text>
            <text x="65" y="704" class="node-sub">store/messages.db: sessions, tasks, cursors</text>
            <text x="700" y="682" class="node-sub" text-anchor="middle">data/sessions/&lt;group&gt;/.claude/</text>
            <text x="982" y="682" class="node-sub" text-anchor="middle">groups/&lt;group&gt;/</text>
            <text x="1097" y="682" class="node-sub" text-anchor="middle">data/sessions/&lt;group&gt;/.claude/</text>
            <text x="1212" y="682" class="node-sub" text-anchor="middle">data/ipc/&lt;group&gt;/</text>
          </g>

          <!-- Same-row arrows: no diagonal crossings -->
          <line class="flow" x1="300" y1="130" x2="380" y2="130" stroke="#d29922" stroke-width="3" marker-end="url(#arrowOrange)"/>
          <text x="308" y="118" class="edge-label">poll</text>
          <line class="flow" x1="380" y1="150" x2="300" y2="150" stroke="#d29922" stroke-width="2" marker-end="url(#arrowOrange)"/>
          <text x="308" y="168" class="edge-label">reply</text>

          <line class="flow" x1="480" y1="200" x2="480" y2="240" stroke="#58a6ff" stroke-width="3" marker-end="url(#arrowBlue)"/>
          <line class="flow" x1="480" y1="360" x2="480" y2="400" stroke="#79c0ff" stroke-width="3" marker-end="url(#arrowBlue)"/>

          <!-- Runner <-> Session Manager routed through the empty 580-620 corridor, staying clear of Queue -->
          <path class="flow" d="M580,440 L600,440 L600,300 L620,300" fill="none" stroke="#bc8cff" stroke-width="3" marker-end="url(#arrowPurple)"/>
          <path class="flow" d="M620,320 L608,320 L608,460 L580,460" fill="none" stroke="#bc8cff" stroke-width="2" marker-end="url(#arrowPurple)"/>
          <text x="586" y="392" class="edge-label" transform="rotate(-90 586 392)">session id</text>

          <!-- Session Manager -> host state, own vertical lane, clear of Runner and Container -->
          <line class="flow" x1="720" y1="360" x2="720" y2="620" stroke="#bc8cff" stroke-width="3" marker-end="url(#arrowPurple)"/>

          <!-- Runner -> Container, elbow routed through the empty 580-900 corridor above hostState -->
          <path class="flow" d="M580,480 L860,480 L860,175 L900,175" fill="none" stroke="#3fb950" stroke-width="3" marker-end="url(#arrowGreen)"/>
          <text x="620" y="470" class="edge-label">docker run --rm</text>

          <!-- Mount points -> host state, straight verticals in clear space -->
          <line class="flow" x1="982" y1="530" x2="982" y2="620" stroke="#d29922" stroke-width="2" marker-end="url(#arrowOrange)"/>
          <line class="flow" x1="1097" y1="530" x2="1097" y2="620" stroke="#bc8cff" stroke-width="2" marker-end="url(#arrowPurple)"/>
          <line class="flow" x1="1212" y1="530" x2="1212" y2="620" stroke="#79c0ff" stroke-width="2" marker-end="url(#arrowBlue)"/>
        </svg>
      </div>
